name: iOS
# Baut und testet die native App (Ordner ios/) auf einem Mac von GitHub.
# Das Protokoll landet im Branch «ci-logs» (Datei <branch>.txt), weil Logs dort einfacher lesbar sind.
on:
  push:
    branches: [swift, 'swift-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
env:
  DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
jobs:
  build:
    # Standard: macOS 15 + Xcode 26.2. Mit «[xc27]» in der Commit-Nachricht: macOS 26 + neuestes Xcode 27 (Prüfung für das aktuelle Xcode)
    runs-on: ${{ contains(github.event.head_commit.message, '[xc27]') && 'macos-26' || 'macos-15' }}
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - name: Xcode wählen
        run: |
          mkdir -p ci-out
          if ${{ contains(github.event.head_commit.message, '[xc27]') }}; then
            X=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
            if [ -n "$X" ]; then echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"; fi
          fi
          ls -d /Applications/Xcode*.app > ci-out/xcode.txt 2>&1 || true
      - name: Kern testen (swift test)
        id: core
        continue-on-error: true
        run: |
          mkdir -p ci-out
          if [ -d ios/KontivoCore ]; then
            cd ios/KontivoCore
            set -o pipefail
            swift test 2>&1 | tee ../../ci-out/core.txt
          else
            echo "kein ios/KontivoCore" > ci-out/core.txt
          fi
      - name: App bauen (xcodebuild)
        id: app
        continue-on-error: true
        run: |
          mkdir -p ci-out
          if [ -f ios/project.yml ]; then
            brew list xcodegen >/dev/null 2>&1 || brew install xcodegen >/dev/null 2>&1
            cd ios
            xcodegen generate 2>&1 | tee ../ci-out/app.txt
            set -o pipefail
            xcodebuild -project Kontivo.xcodeproj -scheme Kontivo -destination 'generic/platform=iOS Simulator' \
              -derivedDataPath ../build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee -a ../ci-out/app.txt
          else
            echo "kein ios/project.yml" > ci-out/app.txt
          fi
      - name: UI-Tests
        id: ui
        if: steps.app.outcome == 'success' && !contains(github.event.head_commit.message, '[noui]')
        continue-on-error: true
        # 49 UI-Tests brauchen ~47 min plus Aufwärmlauf; 55 min reichten knapp nicht (Ergebnis erst nach dem Abbruch fertig)
        timeout-minutes: 72
        run: |
          mkdir -p ci-out
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-2[6-9]-[0-9]*' | sort -V | tail -1)
          UDID=$(xcrun simctl create kqa-ui "iPhone 17 Pro" "$RT" 2>/dev/null || true)
          if [ -n "$UDID" ]; then
            xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
            xcrun simctl bootstatus "$UDID" -b >/dev/null 2>&1 || true
            DEST="id=$UDID"
          else
            DEST='platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2'
          fi
          echo "runtime=$RT udid=$UDID dest=$DEST" > ci-out/ui-info.txt
          echo "QA_UDID=$UDID" >> "$GITHUB_ENV"
          # Simulator aufwärmen: App einmal installieren und starten (erster Start im frischen Simulator brach mit
          # «Failed to get background assertion» ab)
          if [ -n "$UDID" ] && [ -d build/Build/Products/Debug-iphonesimulator/Kontivo.app ]; then
            xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Kontivo.app >/dev/null 2>&1 || true
            xcrun simctl launch "$UDID" ch.kontivo.app -uiDemo >/dev/null 2>&1 || true
            sleep 20
            xcrun simctl terminate "$UDID" ch.kontivo.app >/dev/null 2>&1 || true
          fi
          # Aufwärmlauf (Ergebnis zählt nicht): der allererste Teststart im frischen Simulator bricht teils ab
          # («Restarting after unexpected exit …», Test-Runner neu gestartet, Test fehlt in der Zählung)
          xcodebuild test -project ios/Kontivo.xcodeproj -scheme Kontivo -destination "$DEST" -derivedDataPath build \
            -only-testing:KontivoUITests/SyncUITests CODE_SIGNING_ALLOWED=NO > ci-out/ui-warmup.txt 2>&1 || true
          set -o pipefail
          xcodebuild test -project ios/Kontivo.xcodeproj -scheme Kontivo -destination "$DEST" \
            -derivedDataPath build -resultBundlePath ci-out/ui.xcresult \
            -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ci-out/ui.txt
      - name: UI-Tests auswerten
        if: always() && steps.ui.outcome != 'skipped'
        continue-on-error: true
        run: |
          mkdir -p ci-out/uishots
          sed -n '/Test Suite .* started/,$p' ci-out/ui.txt > ci-out/ui-tests.txt 2>/dev/null || true
          if [ -d ci-out/ui.xcresult ]; then
            xcrun xcresulttool export attachments --path ci-out/ui.xcresult --output-path ci-out/uiatt >/dev/null 2>&1 || true
            python3 - <<'PY' || true
          import json, os, shutil
          src = 'ci-out/uiatt'; dst = 'ci-out/uishots'
          m = json.load(open(os.path.join(src, 'manifest.json')))
          n = 0
          for t in m:
              tid = str(t.get('testIdentifier', 'test')).split('/')[-1].replace('()', '')
              for a in t.get('attachments', []):
                  f = a.get('exportedFileName')
                  if not f or not f.lower().endswith(('.png', '.jpg', '.jpeg')):
                      continue
                  n += 1
                  if n > 40:
                      break
                  ext = os.path.splitext(f)[1]
                  name = ('%02d-%s-%s' % (n, tid, a.get('suggestedHumanReadableName', ''))).replace('/', '_').replace(' ', '_')[:110]
                  shutil.copy(os.path.join(src, f), os.path.join(dst, name + ext))
          PY
            for f in ci-out/uishots/*; do [ -f "$f" ] && sips -Z 1200 "$f" >/dev/null 2>&1; done || true
          fi
          # Simulator der UI-Tests beenden (Speicher für die Bildschirmfotos)
          if [ -n "$QA_UDID" ]; then xcrun simctl shutdown "$QA_UDID" >/dev/null 2>&1 || true; xcrun simctl delete "$QA_UDID" >/dev/null 2>&1 || true; fi
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i kontivo > ci-out/ui-crash.txt || true
          for f in ~/Library/Logs/DiagnosticReports/*Kontivo*; do [ -f "$f" ] && { echo "== $f"; head -c 6000 "$f"; echo; } >> ci-out/ui-crash.txt; done 2>/dev/null || true
      - name: Bildschirmfotos im Simulator
        id: shots
        if: steps.app.outcome == 'success' && (github.ref_name == 'swift' || contains(github.event.head_commit.message, '[shots]'))
        continue-on-error: true
        timeout-minutes: 28
        run: |
          mkdir -p ci-out/shots
          APP=build/Build/Products/Debug-iphonesimulator/Kontivo.app
          RT=$(xcrun simctl list runtimes | grep -o 'com.apple.CoreSimulator.SimRuntime.iOS-2[6-9]-[0-9]*' | sort -V | tail -1)
          PHONE=$(xcrun simctl create kphone "iPhone 17 Pro" "$RT")
          PADTYPE=$(xcrun simctl list devicetypes | grep -o 'iPad Pro 13-inch[^(]*([^)]*)' | head -1)
          PAD=$(xcrun simctl create kpad "$PADTYPE" "$RT" 2>/dev/null || true)
          echo "runtime=$RT phone=$PHONE padtype=$PADTYPE pad=$PAD" > ci-out/shots.txt
          shoot() { # gerät name args...
            D=$1; N=$2; shift 2
            echo "$(date +%T) $N" >> ci-out/shots.txt
            xcrun simctl terminate $D ch.kontivo.app >/dev/null 2>&1 || true
            xcrun simctl launch $D ch.kontivo.app "$@" >/dev/null 2>&1 || echo "launch fail $N" >> ci-out/shots.txt
            sleep 7
            if ! xcrun simctl spawn $D launchctl list 2>/dev/null | grep -q ch.kontivo.app; then echo "ABSTURZ? $N" >> ci-out/shots.txt; fi
            xcrun simctl io $D screenshot "ci-out/shots/$N.png" >/dev/null 2>&1
            sips -Z 1400 "ci-out/shots/$N.png" >/dev/null 2>&1 || true
          }
          # iPad zuerst (nur 3 Fotos), damit sie bei knapper Zeit nicht wegfallen
          if [ -n "$PAD" ]; then
            xcrun simctl boot $PAD; xcrun simctl bootstatus $PAD -b >/dev/null 2>&1
            xcrun simctl install $PAD $APP
            shoot $PAD 26-ipad-vertraege -uiDemo -uiTab contracts
            shoot $PAD 27-ipad-kosten -uiDemo -uiTab costs
            shoot $PAD 28-ipad-formular -uiDemo -uiSheet form
            xcrun simctl shutdown $PAD >/dev/null 2>&1 || true
          fi
          xcrun simctl boot $PHONE; xcrun simctl bootstatus $PHONE -b >/dev/null 2>&1
          xcrun simctl status_bar $PHONE override --time 9:41 --batteryState charged --batteryLevel 100 >/dev/null 2>&1 || true
          xcrun simctl install $PHONE $APP
          shoot $PHONE 01-onboarding -uiOnboarding
          shoot $PHONE 02-leer-vertraege -uiEmpty
          shoot $PHONE 03-vertraege -uiDemo -uiTab contracts
          shoot $PHONE 04-kosten -uiDemo -uiTab costs
          shoot $PHONE 05-budget -uiDemo -uiTab budget
          shoot $PHONE 06-fristen -uiDemo -uiTab deadlines
          shoot $PHONE 07-mehr -uiDemo -uiTab more
          shoot $PHONE 08-detail -uiDemo -uiSheet detail
          shoot $PHONE 09-formular -uiDemo -uiSheet form
          shoot $PHONE 10-bearbeiten -uiDemo -uiSheet edit
          shoot $PHONE 10b-detail-sonderkuendigung -uiDemo -uiSeed skr -uiTab contracts -uiSheet detail:Krankenkasse
          shoot $PHONE 11-einnahme -uiDemo -uiSheet income
          shoot $PHONE 12-einnahmen -uiDemo -uiTab budget -uiSheet incomes
          shoot $PHONE 12b-einnahme-ansicht -uiDemo -uiTab budget -uiSheet incomeDetail
          shoot $PHONE 13-brief -uiDemo -uiTab deadlines -uiSheet letter
          shoot $PHONE 14-kuendigungsweg -uiDemo -uiSheet cancelpick
          shoot $PHONE 15-verwalten -uiDemo -uiTab more -uiSheet manage
          shoot $PHONE 16-vertragspartner -uiDemo -uiSheet partners
          shoot $PHONE 17-inhaber -uiDemo -uiSheet persons
          shoot $PHONE 18-absender -uiDemo -uiSheet sender
          shoot $PHONE 19-kategorien -uiDemo -uiSheet categories
          shoot $PHONE 20-datenqualitaet -uiDemo -uiSheet quality
          shoot $PHONE 21-leer-kosten -uiEmpty -uiTab costs
          shoot $PHONE 22-leer-fristen -uiEmpty -uiTab deadlines
          for P in 1 2 3 4 5 6 7; do shoot $PHONE 40-onb-$P -uiOnboarding -uiOnbPage $P; done
          shoot $PHONE 41-fristen-vorgemerkt -uiDemo -uiTab deadlines -uiDeadlines marked -uiSeed endsself
          shoot $PHONE 42-fristen-offen -uiDemo -uiTab deadlines -uiDeadlines review,folds,end
          shoot $PHONE c1-kosten-liste -uiDemo -uiTab costs -uiScrollTo kbList
          shoot $PHONE c2-kosten-preistreiber -uiDemo -uiTab costs -uiScrollTo kbDrivers
          shoot $PHONE c3-budget-listen -uiDemo -uiTab budget -uiScrollTo kbIncomes
          shoot $PHONE c4-bericht -uiDemo -uiTab costs -uiSheet report
          shoot $PHONE c5-bericht-pdf -uiDemo -uiTab costs -uiSheet reportPDF
          shoot $PHONE c6-einnahme-bearbeiten -uiDemo -uiTab budget -uiSheet incomeEdit
          shoot $PHONE i30-import-fixkosten -uiEmpty -uiBankSample
          shoot $PHONE i31-import-einnahmen -uiEmpty -uiBankSample -uiBankStep inc
          shoot $PHONE i32-import-fristen -uiEmpty -uiBankSample -uiBankStep term
          shoot $PHONE i33-import-zuordnen -uiDemo -uiBankSample
          shoot $PHONE c-zeitstrahl-halbtax -uiDemo -uiSheet edit:Halbtax
          shoot $PHONE c-detail-preisverlauf -uiDemo -uiSheet detail:Halbtax
          xcrun simctl ui $PHONE appearance dark
          for P in 0 1 2 3 4 5 6 7; do shoot $PHONE 43-dunkel-onb-$P -uiOnboarding -uiOnbPage $P; done
          shoot $PHONE 44-dunkel-fristen -uiDemo -uiTab deadlines
          shoot $PHONE 45-dunkel-fristen-offen -uiDemo -uiTab deadlines -uiDeadlines review,folds,end
          shoot $PHONE 46-dunkel-leer-fristen -uiEmpty -uiTab deadlines
          shoot $PHONE 23-dunkel-vertraege -uiDemo -uiTab contracts
          shoot $PHONE 24-dunkel-kosten -uiDemo -uiTab costs
          shoot $PHONE 25-dunkel-detail -uiDemo -uiSheet detail
          shoot $PHONE c7-dunkel-budget -uiDemo -uiTab budget
          shoot $PHONE c8-dunkel-preistreiber -uiDemo -uiTab costs -uiScrollTo kbDrivers
          shoot $PHONE i34-dunkel-import -uiDemo -uiBankSample
          shoot $PHONE i35-dunkel-import-fristen -uiEmpty -uiBankSample -uiBankStep term
          shoot $PHONE 29-dunkel-mehr -uiDemo -uiTab more
          shoot $PHONE 30-dunkel-verwalten -uiDemo -uiTab more -uiSheet partners
          xcrun simctl ui $PHONE appearance light
          shoot $PHONE 31-splash -uiEmpty -uiSplashHold
          shoot $PHONE 32-mehr-unten -uiDemo -uiTab more -uiMoreBottom
          shoot $PHONE 33-vollstaendigkeit -uiDemo -uiTab more -uiSheet completeness
          shoot $PHONE 34-leer-budget -uiEmpty -uiTab budget
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i kontivo >> ci-out/shots.txt || true
          for f in ~/Library/Logs/DiagnosticReports/*Kontivo*; do [ -f "$f" ] && head -120 "$f" >> ci-out/shots.txt; done 2>/dev/null || true
      - name: Protokoll in Branch ci-logs schreiben
        if: always()
        env:
          BR: ${{ github.ref_name }}
        run: |
          {
            echo "branch=$BR run=$GITHUB_RUN_NUMBER sha=$GITHUB_SHA"
            echo "core=${{ steps.core.outcome }} app=${{ steps.app.outcome }} ui=${{ steps.ui.outcome }}"
            echo "xcode=$(xcodebuild -version 2>/dev/null | tr '\n' ' ') runner=$ImageOS/$ImageVersion"; cat ci-out/xcode.txt 2>/dev/null || true
            echo; echo "===== WARNUNGEN (Kern + App) ====="
            grep -h " warning: " ci-out/core.txt ci-out/app.txt 2>/dev/null | grep -v appintentsmetadataprocessor | sort -u | head -100 || true
            echo; echo "===== KERN: Fehler ====="
            grep -E "error:|failed|FAIL|Test Case .* failed|XCTAssert|Issue recorded|✘" ci-out/core.txt | head -300 || true
            echo; echo "===== KERN: Abweichungen (Details) ====="
            grep -E "≠ Web|nicht gelesen|nicht angelegt" ci-out/core.txt | head -80 || true
            echo; echo "===== KERN: Ende ====="
            tail -60 ci-out/core.txt || true
            echo; echo "===== APP: Fehler ====="
            grep -E "error:|BUILD FAILED|\*\* BUILD" ci-out/app.txt | head -400 || true
            echo; echo "===== APP: Ende ====="
            tail -40 ci-out/app.txt || true
            echo; echo "===== UI-TESTS ====="
            echo "ui=${{ steps.ui.outcome }}"
            cat ci-out/ui-info.txt 2>/dev/null || true
            grep -E "error:|Test Case .*(passed|failed)|Executed [0-9]+ test|\*\* TEST|Testing failed|Restarting after|crash|Crash|APP-ZUSTAND|BUILD FAILED" ci-out/ui.txt 2>/dev/null | head -300 || true
            echo; echo "--- Absturzberichte ---"
            head -c 20000 ci-out/ui-crash.txt 2>/dev/null || echo "keine"
            echo; echo "===== BILDSCHIRMFOTOS ====="
            cat ci-out/shots.txt 2>/dev/null || echo "keine"
          } > /tmp/summary.txt
          if [ -d ios/Kontivo.xcodeproj ]; then tar czf /tmp/xcodeproj.tgz -C ios Kontivo.xcodeproj; fi
          git config --global user.name ci; git config --global user.email ci@example.invalid
          for i in 1 2 3 4 5 6; do
            rm -rf /tmp/cl
            git clone -q --depth 1 --branch ci-logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" /tmp/cl || exit 0
            cp /tmp/summary.txt "/tmp/cl/$BR.txt"
            if [ -f /tmp/xcodeproj.tgz ]; then cp /tmp/xcodeproj.tgz "/tmp/cl/$BR-xcodeproj.tgz"; fi
            if [ -d ci-out/shots ] && ls ci-out/shots/*.png >/dev/null 2>&1; then rm -rf "/tmp/cl/shots-$BR"; mkdir -p "/tmp/cl/shots-$BR"; cp ci-out/shots/*.png "/tmp/cl/shots-$BR/"; fi
            if [ -f ci-out/ui-tests.txt ]; then head -c 4000000 ci-out/ui-tests.txt > "/tmp/cl/$BR-ui.txt"; fi
            rm -rf "/tmp/cl/ui-$BR"; if ls ci-out/uishots/* >/dev/null 2>&1; then mkdir -p "/tmp/cl/ui-$BR"; cp ci-out/uishots/* "/tmp/cl/ui-$BR/"; fi
            (cd /tmp/cl && git add -A && git commit -q -m "log $BR $GITHUB_RUN_NUMBER" && git push -q origin ci-logs) && break
            sleep $((RANDOM % 7 + 3))
          done
      - name: Status
        if: always()
        run: |
          if [ "${{ steps.core.outcome }}" != "success" ] || [ "${{ steps.app.outcome }}" != "success" ]; then exit 1; fi
          if [ "${{ steps.ui.outcome }}" = "failure" ]; then echo "UI-Tests fehlgeschlagen"; exit 1; fi
