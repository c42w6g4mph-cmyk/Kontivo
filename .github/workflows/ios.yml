name: iOS
on:
  push:
    branches: [swift]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Umgebung
        run: |
          mkdir -p ci-out
          {
          sw_vers
          ls /Applications | grep -i xcode
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available | grep -i iphone | head -20
          brew list --versions xcodegen || echo "xcodegen fehlt"
          swift --version
          } > ci-out/log.txt 2>&1 || true
      - name: Log zurückschreiben
        if: always()
        run: |
          git config user.name ci; git config user.email ci@example.invalid
          cp ci-out/log.txt /tmp/log.txt
          git fetch origin ci-logs || true
          if git rev-parse --verify origin/ci-logs >/dev/null 2>&1; then git checkout -B ci-logs origin/ci-logs; else git checkout --orphan ci-logs; git rm -rf . >/dev/null; fi
          cp /tmp/log.txt "run-${GITHUB_RUN_NUMBER}.txt"; cp /tmp/log.txt latest.txt
          git add run-*.txt latest.txt; git commit -m "log ${GITHUB_RUN_NUMBER}" -q; git push origin ci-logs -q
