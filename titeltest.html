<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kontivo – Titel-Test</title>
<style>
@font-face{font-family:"Kontivo Serif";src:url(fonts/kontivo-serif.woff) format("woff");font-weight:500}
:root{--serif:ui-serif,"New York","Kontivo Serif",Georgia,serif}
body{margin:0;background:#D5D7DA;font-family:-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.intro{padding:max(18px,env(safe-area-inset-top)) 16px 6px;font-size:14px;color:#333;line-height:1.4}
.v{margin:14px 12px 22px}
.lab{font:600 15px -apple-system,system-ui,sans-serif;color:#111;margin:0 4px 8px}
.pair{display:grid;grid-template-columns:1fr;gap:10px}
.scr{border-radius:18px;padding:18px 18px 16px;overflow:hidden}
.L{background:#F4F4F2;color:#121314}.D{background:#2C2D30;color:#E8E6E2}
.top{display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:30px;line-height:1.1}
.yr{display:flex;align-items:center;gap:8px;font:700 17px -apple-system,system-ui}
.yr i{width:30px;height:30px;border-radius:50%;border:1px solid currentColor;opacity:.25;display:inline-block}
.card{margin-top:14px;border-radius:16px;padding:14px 16px}
.L .card{background:#fff}.D .card{background:#36373B}
.mo{font-size:12.5px;font-weight:600;opacity:.7}
.big{font-family:var(--serif);font-weight:500;font-size:44px;letter-spacing:-.01em;margin-top:4px;font-variant-numeric:tabular-nums}
.big small{font-size:.55em;opacity:.7}.big u{text-decoration:none;font:500 13px -apple-system,system-ui;opacity:.6;margin-left:6px}
.bar{width:40px;height:2px;border-radius:1px;margin:6px 0 8px}.L .bar{background:#A88437}.D .bar{background:#C6AB78}
.sub{font-size:12.5px;opacity:.6}
.r0 h1{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:-.025em}
.r1 h1{font-family:-apple-system,system-ui,sans-serif;font-weight:700;letter-spacing:-.025em}
.r2 h1{font-family:-apple-system,system-ui,sans-serif;font-weight:600;letter-spacing:-.015em}
.r3 h1{font-family:-apple-system,system-ui,sans-serif;font-weight:600;font-size:27px;letter-spacing:-.012em}
.r4 h1{font-family:var(--serif);font-weight:500;font-size:32px;letter-spacing:-.01em}
</style></head><body>
<div class="intro"><b>Titel-Test</b> – nur zur Ansicht, ändert nichts an der App. Jede Variante hell und dunkel, mit echter iPhone-Schrift.</div>
<script>
var V=[["r0","Heute · SF Pro Rounded, Bold"],["r1","1 · SF Pro (nicht gerundet), Bold"],["r2","A · SF Pro, Semibold (Empfehlung)"],["r3","B · SF Pro, Semibold, etwas kleiner"],["r4","Zum Vergleich · Serif"]];
var T=[["L","Budget","Oktober 2026","5’381",".11","verfügbar nach Fixkosten · 66 % der Einnahmen"],["D","Verträge","Fixkosten pro Monat","2’781",".86","33’382 CHF im Jahr"]];
document.write(V.map(function(v){return '<div class="v '+v[0]+'"><div class="lab">'+v[1]+'</div><div class="pair">'+T.map(function(t){
 return '<div class="scr '+t[0]+'"><div class="top"><h1>'+t[1]+'</h1>'+(t[0]=="L"?'<div class="yr"><i></i>2026<i></i></div>':'')+'</div><div class="card"><div class="mo">'+t[2]+'</div><div class="big">'+t[3]+'<small>'+t[4]+'</small><u>CHF</u></div><div class="bar"></div><div class="sub">'+t[5]+'</div></div></div>';}).join("")+'</div></div>';}).join(""));
</script>
</body></html>
