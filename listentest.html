<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kontivo – Listen-Test</title>
<style>
body{margin:0;background:#D5D7DA;font-family:-apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
.intro{padding:max(18px,env(safe-area-inset-top)) 16px 6px;font-size:14px;color:#333;line-height:1.4}
.v{margin:14px 12px 22px}.lab{font:600 15px -apple-system,system-ui;color:#111;margin:0 4px 8px}
.scr{border-radius:18px;padding:14px;margin-bottom:10px}
.L{background:#F4F4F2;color:#121314;--s:#fff;--i2:#5E6064;--ln:#E6E6E3}.D{background:#2C2D30;color:#E8E6E2;--s:#36373B;--i2:#A8A7A3;--ln:#45464A}
.grp{font:600 13px -apple-system,system-ui;margin:2px 4px 6px;opacity:.85}
.list{background:var(--s);border-radius:16px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;position:relative}
.row+.row:before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--ln)}
.mk{width:36px;height:36px;border-radius:10px;flex:none;display:grid;place-items:center}
.mk i{width:14px;height:14px;border-radius:4px;border:2px solid currentColor;opacity:.9}
.m{flex:1;min-width:0}.n{font-size:16px;line-height:1.25}.s{font-size:12.5px;color:var(--i2);margin-top:1px}
.a{text-align:right;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}.a u{text-decoration:none;font-size:11px;font-weight:500;color:var(--i2);margin-left:4px}
.a em{display:block;font-style:normal;font-size:11px;font-weight:400;color:var(--i2)}
.r0 .n{font-family:ui-rounded,"SF Pro Rounded",-apple-system,system-ui;font-weight:600}
.r1 .n{font-family:-apple-system,system-ui;font-weight:600;letter-spacing:-.005em}
.r2 .n{font-family:-apple-system,system-ui;font-weight:500}
</style></head><body>
<div class="intro"><b>Listen-Test</b> – nur zur Ansicht. Betroffen sind die <b>Vertragsnamen</b> in den Listen (Verträge, Fristen, Kosten) und Werte in der Detailansicht. Die Beträge rechts sind schon heute normale SF Pro.</div>
<script>
var V=[["r0","Heute · SF Pro Rounded, Semibold"],["r1","A · SF Pro, Semibold (Empfehlung)"],["r2","B · SF Pro, Medium (leiser)"]];
var R=[["#8A6FB0","Miete","Immo AG · monatlich","1’850.00","nächste 01.11."],["#3F6E9A","Handy","Swisscom · monatlich","49.90","nächste 27.10."],["#C77B4A","Krankenkasse","Helsana · monatlich","412.35","nächste 01.11."],["#4F8A6B","Rundfunkgebühr","Erhebungsstelle · jährlich","335.00","nächste 15.03."]];
function card(t){return '<div class="scr '+t+'"><div class="grp">Wohnen & Alltag</div><div class="list">'+R.map(function(r){return '<div class="row"><span class="mk" style="background:color-mix(in srgb,'+r[0]+' '+(t=="L"?16:30)+'%,var(--s));color:'+r[0]+'"><i></i></span><span class="m"><div class="n">'+r[1]+'</div><div class="s">'+r[2]+'</div></span><span class="a">'+r[3]+'<u>CHF</u><em>'+r[4]+'</em></span></div>';}).join("")+'</div></div>';}
document.write(V.map(function(v){return '<div class="v '+v[0]+'"><div class="lab">'+v[1]+'</div>'+card("L")+card("D")+'</div>';}).join(""));
</script></body></html>
