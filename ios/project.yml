# Xcode-Projekt für Kontivo. Erzeugen auf dem Mac:  brew install xcodegen && cd ios && xcodegen
name: Kontivo
options:
  bundleIdPrefix: ch.kontivo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de-CH
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KontivoCore:
    path: KontivoCore
targets:
  Kontivo:
    type: application
    platform: iOS
    sources:
      - path: Kontivo
        excludes:
          - Resources/PrivacyInfo.xcprivacy
      # Datenschutz-Manifest (App Store): ausdrücklich als Ressource ins App-Bundle
      - path: Kontivo/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: KontivoCore
    info:
      path: Kontivo/Info.plist
      properties:
        CFBundleDisplayName: Kontivo
        CFBundleDevelopmentRegion: de-CH
        CFBundleLocalizations:
          - de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        # Startbildschirm in Papierfarbe (wie der App-Hintergrund), sonst blitzt beim Start Petrol auf
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Hurricane-Regular.ttf
          - LaBelleAurore.ttf
          - Licorice-Regular.ttf
          - Zeyada.ttf
          - Qwigley-Regular.ttf
          - Bilbo-Regular.ttf
        # Nur Berechtigungen, die die App wirklich nutzt (Kalender: Frist eintragen; Fotos: «Bild sichern» im Teilen-Menü;
        # Kamera und Fotos: Kontoauszug fotografieren bzw. wählen – Texterkennung nur auf dem Gerät)
        NSCalendarsWriteOnlyAccessUsageDescription: Kontivo trägt Kündigungsfristen auf deinen Wunsch in den Kalender ein.
        NSPhotoLibraryAddUsageDescription: Kontivo speichert Bilder auf deinen Wunsch in deiner Fotomediathek.
        NSCameraUsageDescription: Kontivo fotografiert auf deinen Wunsch deinen Kontoauszug, um Fixkosten zu finden. Das Bild wird nur auf diesem Gerät gelesen und nicht gespeichert.
        NSPhotoLibraryUsageDescription: Kontivo liest auf deinen Wunsch Fotos deines Kontoauszugs, um Fixkosten zu finden. Die Bilder werden nur auf diesem Gerät gelesen und nicht gespeichert.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kontivo.app
        PRODUCT_NAME: Kontivo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  KontivoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KontivoUITests
    dependencies:
      - target: Kontivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kontivo.app.uitests
        PRODUCT_NAME: KontivoUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Kontivo
        CODE_SIGN_STYLE: Automatic
schemes:
  Kontivo:
    build:
      targets:
        Kontivo: all
        KontivoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: KontivoUITests
          parallelizable: false
    archive:
      config: Release
