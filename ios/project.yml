# Xcode-Projekt für Kontivo. Erzeugen auf dem Mac:  brew install xcodegen && cd ios && xcodegen
name: Kontivo
options:
  bundleIdPrefix: ch.kontivo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: de-CH
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  KontivoCore:
    path: KontivoCore
targets:
  Kontivo:
    type: application
    platform: iOS
    sources:
      - path: Kontivo
    dependencies:
      - package: KontivoCore
    info:
      path: Kontivo/Info.plist
      properties:
        CFBundleDisplayName: Kontivo
        CFBundleDevelopmentRegion: de-CH
        CFBundleLocalizations:
          - de
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - Hurricane-Regular.ttf
          - LaBelleAurore.ttf
          - Licorice-Regular.ttf
          - Zeyada.ttf
          - Qwigley-Regular.ttf
          - Bilbo-Regular.ttf
        NSCalendarsWriteOnlyAccessUsageDescription: Kontivo trägt Kündigungsfristen auf deinen Wunsch in den Kalender ein.
        NSCalendarsFullAccessUsageDescription: Kontivo trägt Kündigungsfristen auf deinen Wunsch in den Kalender ein.
        NSCameraUsageDescription: Kontivo nutzt die Kamera, um Dokumente zu einem Vertrag zu fotografieren.
        NSFaceIDUsageDescription: Kontivo kann mit Face ID gesperrt werden.
        LSSupportsOpeningDocumentsInPlace: false
        UISupportsDocumentBrowser: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kontivo.app
        PRODUCT_NAME: Kontivo
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
  KontivoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: KontivoUITests
    dependencies:
      - target: Kontivo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kontivo.app.uitests
        PRODUCT_NAME: KontivoUITests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_TARGET_NAME: Kontivo
        CODE_SIGN_STYLE: Automatic
schemes:
  Kontivo:
    build:
      targets:
        Kontivo: all
        KontivoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - name: KontivoUITests
          parallelizable: false
    archive:
      config: Release
